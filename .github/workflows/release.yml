name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version to create, e.g. v0.2.1 (the workflow creates the tag). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2

      - name: Test
        run: cargo test --release

      - name: Build multiversion.wasm
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: multiversion
          path: target/wasm32-wasip2/release/multiversion.wasm
          if-no-files-found: error

      - name: Publish the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/wasm32-wasip2/release && sha256sum multiversion.wasm > multiversion.wasm.sha256 && cd -
          # What changed since the previous release, from the commit messages (subjects, plus
          # their "- " bullet lines). Lines mentioning tooling vendors are left out.
          prev=$(git tag --merged HEAD --sort=-v:refname | grep -vxF "$TAG" | head -1 || true)
          range="${prev:+$prev..}HEAD"
          {
            if [ -n "$prev" ]; then echo "## What's changed since $prev"; else echo "## What's in this release"; fi
            echo
            git log "$range" --no-merges --format='@@%s%n%b' | awk '
              function flush() { if (cur != "") print cur; cur = "" }
              /^@@/ { flush(); print "- " substr($0, 3); next }
              /^- / { flush(); cur = "  " $0; next }
              /^  [^ ]/ && cur != "" { sub(/^  /, ""); cur = cur " " $0; next }
              { flush() }
              END { flush() }' | grep -viE 'claude|anthropic|co-authored-by|^ *$' || echo "- Maintenance release."
            echo
          } > changes.md
          {
            cat changes.md
            echo "## Install"
            echo
            echo "Drop \`multiversion.wasm\` into your Pumpkin server's \`plugins/\` folder and restart. With the Mineversed web panel, \`pumpkin.toml\` is set up for it automatically; otherwise apply \`plugins/data/multiversion/pumpkin-settings.txt\` to \`pumpkin.toml\` and restart again. See the README."
          } > release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" target/wasm32-wasip2/release/multiversion.wasm target/wasm32-wasip2/release/multiversion.wasm.sha256 \
            --title "multiversion $TAG" --notes-file release-notes.md
