[package]
name = "multiversion"
version = "0.2.17"
edition = "2024"
license = "GPL-3.0"
description = "Pumpkin plugin: lets older and newer Minecraft Java clients join by translating their protocol inside the server process"
publish = false

[lib]
# Capitalised so the build produces Multiversion.wasm.
name = "Multiversion"
crate-type = ["cdylib"]

[dependencies]
# Pinned to the same Pumpkin commit as build.sh
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "eda69440e6369c5f8a05c3f69fc809c40dab93a6" }
wasip2 = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
aes = "0.8"
cfb8 = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["custom"] }
num-bigint-dig = "0.8"
uuid = { version = "1", default-features = false }
thiserror = "2"
hex = "0.4"
ed25519-dalek = "2"

[profile.release]
# Size-optimized so the plugin fits the Pumpkin Market's 5 MB upload limit; translation is mostly
# table lookups, so speed is barely affected.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
